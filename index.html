<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#07171E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<title>Эхолот - карта дна и места</title>
<style>
:root{
  --abyss:#07171E;
  --deep:#0C232D;
  --shelf:#11303C;
  --ridge:#1D4C5B;
  --foam:#EAF4F3;
  --mist:#8FB0B6;
  --lure:#F0B429;
  --shallow:#4FD1C5;
  --danger:#E2683F;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --font-num:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --bar:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--abyss);
  color:var(--foam);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.4;
  overscroll-behavior-y:none;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 60% at 50% -10%, rgba(79,209,197,.10), transparent 60%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lure);outline-offset:2px}

/* ---------- Шапка ---------- */
.bar{
  position:sticky;top:0;z-index:30;
  height:calc(var(--bar) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:6px;
  background:rgba(7,23,30,.88);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--ridge);
}
.bar-btn{
  width:46px;height:46px;flex:0 0 46px;
  display:grid;place-items:center;border-radius:12px;color:var(--foam);
}
.bar-btn:active{background:rgba(255,255,255,.07)}
.bar-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#addBtn{color:var(--lure)}
.bar-title{
  flex:1;min-width:0;
  font-family:var(--font-num);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--foam);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
}
main{position:relative;z-index:1;padding:14px 14px calc(28px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}

/* ---------- Типографика ---------- */
.eyebrow{
  font-family:var(--font-num);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mist);margin:22px 2px 8px;
}
.eyebrow:first-child{margin-top:4px}
h2{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--mist)}
.tiny{font-size:12.5px}

/* ---------- Панели ---------- */
.card{
  background:linear-gradient(180deg,var(--deep),#0A1F27);
  border:1px solid var(--ridge);border-radius:14px;padding:14px;margin-bottom:10px;
}
.place{display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;padding:12px;position:relative}
.place:active{border-color:var(--shallow)}
.thumb{
  width:58px;height:58px;flex:0 0 58px;border-radius:10px;object-fit:cover;
  background:var(--shelf);border:1px solid var(--ridge);
}
.thumb.ph{display:grid;place-items:center;color:var(--ridge);font-family:var(--font-num);font-size:20px}
.dirbadge{width:58px;height:58px;flex:0 0 58px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 45%, #0f2c38, #081d25);border:1px solid var(--ridge);
  display:grid;place-items:center}
.dirbadge.big{width:66px;height:66px;flex:0 0 66px}
.dirbadge .deg{font-size:12px;color:var(--foam);position:relative;z-index:1}
.dirbadge .q{font-size:19px;color:var(--ridge);font-family:var(--font-num)}
.dirbadge .needle{position:absolute;inset:0;border-radius:50%}
.dirbadge .needle::before{content:"";position:absolute;left:50%;top:5px;width:0;height:0;margin-left:-4px;
  border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:11px solid var(--lure)}
.dirbadge::after{content:"С";position:absolute;top:2px;left:50%;transform:translateX(-50%);
  font-family:var(--font-num);font-size:8px;color:var(--mist);opacity:.55}
.place-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.place-name{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place-meta{font-size:12.5px;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{width:100%;height:34px;display:block;margin-top:8px;border-radius:6px}

/* ---------- Кнопки ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:48px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15.5px;
  border:1px solid var(--ridge);background:var(--shelf);color:var(--foam);
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--lure);color:#231903;border-color:var(--lure)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:rgba(226,104,63,.4)}
.btn.wide{width:100%}
.btn.sm{height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* ---------- Поля ---------- */
label.f{display:block;margin-bottom:10px}
label.f>span{
  display:block;font-family:var(--font-num);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mist);margin-bottom:5px;
}
input[type=text],input[type=number],textarea,select{
  width:100%;height:48px;padding:0 12px;border-radius:11px;
  background:#081D25;border:1px solid var(--ridge);color:var(--foam);
  font-family:var(--font-num);font-size:16px;appearance:none;
}
textarea{height:84px;padding:11px 12px;font-family:var(--font-ui);resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mist) 50%),linear-gradient(135deg,var(--mist) 50%,transparent 50%);
  background-position:calc(100% - 18px) 21px,calc(100% - 12px) 21px;background-size:6px 6px;background-repeat:no-repeat}
input:focus,textarea:focus,select:focus{border-color:var(--shallow);outline:none}
input[type=file]{display:none}

/* ---------- Быстрая запись замера ---------- */
.quick{display:flex;gap:8px;align-items:flex-end}
.castrow{display:flex;gap:10px;align-items:flex-end;padding-bottom:11px;border-bottom:1px solid var(--ridge)}
.castrow .btn{flex:0 0 auto}
.quick label.f{flex:1;margin-bottom:0}
.quick .btn{flex:0 0 52px;padding:0;font-size:24px;line-height:1}

/* ---------- Список замеров ---------- */
.mrow{
  display:flex;align-items:center;gap:10px;padding:11px 12px;
  border:1px solid var(--ridge);border-radius:12px;margin-bottom:8px;background:var(--deep);
}
.mrow .idx{font-family:var(--font-num);font-size:11px;color:var(--ridge);width:22px;flex:0 0 22px}
.mrow .val{font-family:var(--font-num);font-size:17px;font-variant-numeric:tabular-nums}
.mrow .val small{font-size:11px;color:var(--mist);letter-spacing:.1em;margin-left:3px}
.mrow .grow{flex:1;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.icobtn{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border-radius:9px;color:var(--mist)}
.icobtn:active{background:rgba(255,255,255,.07)}
.icobtn.on{color:var(--lure);background:rgba(240,180,41,.14)}
.icobtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mrow.edit{flex-wrap:wrap}
.mrow.edit input{height:42px}

/* ---------- Группа замеров на одних оборотах ---------- */
.mgroup{border:1px solid var(--ridge);border-radius:12px;margin-bottom:8px;background:var(--deep);overflow:hidden}
.mgroup>.mrow{border:0;border-radius:0;margin:0;background:none}
.mgroup.open>.ghead{border-bottom:1px solid var(--ridge)}
.gtoggle{flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0;color:inherit;text-align:left}
.gtoggle .chev{margin-left:auto;color:var(--mist);font-size:13px;transition:transform .15s}
.mgroup.open .gtoggle .chev{transform:rotate(180deg)}
.gbadge{font-family:var(--font-num);font-size:11px;letter-spacing:.06em;color:var(--lure);
  border:1px solid rgba(240,180,41,.4);border-radius:9px;padding:1px 7px}
.gspread{font-family:var(--font-num);font-size:11px;color:var(--mist)}
.gbody{padding:9px 10px 1px;background:rgba(7,23,30,.5)}
.gbody .mrow{border:1px solid var(--ridge);border-radius:10px;margin-bottom:8px;background:var(--deep)}

/* ---------- Карта дна ---------- */
.chartwrap{border:1px solid var(--ridge);border-radius:14px;overflow:hidden;background:#061219}
#chart{display:block;width:100%;height:340px}
#topmap{display:block;width:100%;height:380px;touch-action:none}
#watermap{width:100%;height:min(68vh,620px);min-height:430px;background:#061219}
.map-status{padding:10px 12px;border:1px solid var(--ridge);border-radius:12px;background:var(--deep);color:var(--mist);font-size:12.5px;margin-top:10px}
.waterbody-kind{display:inline-flex;align-items:center;height:25px;padding:0 9px;border-radius:13px;border:1px solid var(--ridge);color:var(--shallow);font-family:var(--font-num);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.leaflet-container{font-family:var(--font-ui);background:#061219}
.leaflet-control-attribution{background:rgba(7,23,30,.82)!important;color:var(--mist)!important}
.leaflet-control-attribution a{color:var(--shallow)!important}
.leaflet-bar a{background:var(--deep)!important;color:var(--foam)!important;border-color:var(--ridge)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--deep);color:var(--foam)}
.zoombar{position:absolute;top:54px;right:8px;z-index:2;display:flex;flex-direction:column;gap:6px}
.zoombar button{width:38px;height:38px;border-radius:10px;background:rgba(7,23,30,.72);
  border:1px solid var(--ridge);color:var(--foam);font-size:17px;line-height:1}
.chartwrap{position:relative}
.chartwrap.full{position:fixed;inset:0;z-index:70;border-radius:0;border:0;display:flex;flex-direction:column;justify-content:center;background:#061219}
.fsbtn{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:10px;z-index:2;
  background:rgba(7,23,30,.72);border:1px solid var(--ridge);color:var(--foam);font-size:16px;line-height:1}
.tinfo{padding:9px 12px;border-top:1px solid var(--ridge);font-size:13px;color:var(--mist);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tinfo b{color:var(--foam)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--ridge);
  font-family:var(--font-num);font-size:11px;letter-spacing:.08em;color:var(--mist);text-transform:uppercase}
.legend b{color:var(--foam);font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.toggle{position:relative;width:50px;height:29px;flex:0 0 50px;border-radius:20px;background:var(--shelf);border:1px solid var(--ridge);transition:.18s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--mist);transition:.18s}
.toggle[aria-pressed=true]{background:rgba(240,180,41,.22);border-color:var(--lure)}
.toggle[aria-pressed=true]::after{left:24px;background:var(--lure)}

/* ---------- Показания катушки ---------- */
.readout{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ridge);border:1px solid var(--ridge);border-radius:14px;overflow:hidden}
.readout div{background:#081D25;padding:13px 14px}
.readout .k{font-family:var(--font-num);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.readout .v{font-family:var(--font-num);font-size:22px;margin-top:3px;font-variant-numeric:tabular-nums}
.readout .v.big{font-size:30px;color:var(--lure)}
.readout .span2{grid-column:1/-1}

.chip.sel{border-color:var(--shallow);background:rgba(79,209,197,.14)}
.chip.step{padding:0 14px;font-family:var(--font-num);color:var(--shallow)}
.chip.bch,.chip.mch,.chip.ebch,.chip.emch{padding:0 13px 0 10px;height:36px;font-size:14px;gap:7px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 11px;border:1px solid rgba(0,0,0,.35)}
.mi{font-size:13px;color:var(--shallow);width:14px;text-align:center}
.sub{font-family:var(--font-num);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist);margin:14px 2px 7px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 13px;border-radius:19px;
  border:1px solid var(--ridge);background:var(--deep);font-size:14px}
.chip.on{border-color:var(--lure);background:rgba(240,180,41,.12)}
.chip .x{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:var(--mist);font-size:17px}

/* ---------- Меню ---------- */
#scrim{position:fixed;inset:0;background:rgba(2,10,14,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;left:0;bottom:0;width:276px;max-width:82vw;z-index:50;
  background:var(--deep);border-right:1px solid var(--ridge);
  transform:translateX(-102%);transition:transform .22s ease;
  padding:calc(18px + env(safe-area-inset-top)) 14px 18px;
  display:flex;flex-direction:column;gap:6px;
}
#drawer.on{transform:none}
.brand{font-family:var(--font-num);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--lure);margin:2px 6px 16px}
.mitem{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:11px;width:100%;text-align:left;font-size:15.5px}
.mitem[hidden]{display:none}
.mitem:active,.mitem.on{background:var(--shelf)}
.mitem svg{width:19px;height:19px;flex:0 0 19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--shallow)}
.drawer-foot{margin-top:auto;font-size:11.5px;color:var(--mist);padding:0 8px;line-height:1.5}

/* ---------- Модалка ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(2,10,14,.65)}
#modal.on{display:flex}
.sheet{
  width:100%;max-width:600px;max-height:92vh;overflow:auto;
  background:var(--deep);border:1px solid var(--ridge);border-radius:18px 18px 0 0;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.grab{width:38px;height:4px;border-radius:3px;background:var(--ridge);margin:6px auto 14px}
.sheet h2{margin-bottom:14px}
.photo-prev{width:100%;height:170px;object-fit:cover;border-radius:12px;border:1px solid var(--ridge);margin-bottom:8px}

.empty{text-align:center;padding:40px 16px;color:var(--mist)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.5}
#toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--shelf);border:1px solid var(--ridge);color:var(--foam);
  padding:11px 18px;border-radius:24px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:.2s;
}
#toast.on{opacity:1;transform:translateX(-50%)}
#updateBtn{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:35;box-shadow:0 8px 22px rgba(2,10,14,.5);white-space:nowrap;
}
#updateBtn[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <button class="bar-btn" id="leftBtn" aria-label="Меню">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="bar-title" id="barTitle">Мои водоёмы</div>
  <button class="bar-btn" id="addBtn" aria-label="Добавить">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</header>

<main id="view"></main>

<div id="scrim"></div>
<aside id="drawer">
  <div class="brand">Эхолот</div>
  <button class="mitem" data-nav="waterbodies"><svg viewBox="0 0 24 24"><path d="M4 8c3-2 5-2 8 0s5 2 8 0M4 13c3-2 5-2 8 0s5 2 8 0M4 18c3-2 5-2 8 0s5 2 8 0"/></svg>Мои водоёмы</button>
  <button class="mitem" data-nav="reel"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/></svg>Калькулятор катушки</button>
  <button class="mitem" id="demoBtn"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg>Убрать демо-места</button>
  <button class="mitem" id="exportBtn"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>Сохранить копию</button>
  <button class="mitem" id="importBtn"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L8 7m4-4l4 4M4 17v3h16v-3"/></svg>Загрузить копию</button>
  <input type="file" id="importFile" accept="application/json,.json">
  <button class="mitem" id="installBtn"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 7.5v6m0 0l-2.5-2.5M12 13.5l2.5-2.5"/></svg>Установить на телефон</button>
  <div class="drawer-foot">Данные хранятся только в этом телефоне.<br>Интернет не нужен.</div>
</aside>

<div id="modal"></div>
<button class="btn primary" id="updateBtn" hidden>Обновить приложение</button>
<div id="toast"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app-core.js"></script>

<script>
"use strict";
/* ============================================================
   ХРАНИЛИЩЕ (localStorage; запасной вариант - window.storage)
   ============================================================ */
const KEY = "fishmap.db.v1";
const LS = (() => { try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return localStorage; } catch(e){ return null; } })();

async function rawGet(){
  if (LS) return LS.getItem(KEY);
  if (window.storage) { try { const r = await window.storage.get(KEY); return r ? r.value : null; } catch(e){ return null; } }
  return null;
}
async function rawSet(v){
  if (LS) { try { LS.setItem(KEY, v); return true; } catch(e){ toast("Память телефона переполнена - удалите старые фото"); return false; } }
  if (window.storage) { try { await window.storage.set(KEY, v); return true; } catch(e){ return false; } }
  return false;
}

let DB = { waterbodies:[], reel:null, presets:[], activePreset:null, chartMeters:false };
let LAKE_CATALOG = [];
const LAKE_MANIFESTS = new Map();
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>rawSet(JSON.stringify(DB)), 120); }
function normalizeDB(){ DB = AppCore.normalizeDatabase(DB, uid); }
async function loadLakeCatalog(){
  try {
    const response = await fetch("lakes/index.json");
    if (!response.ok) throw new Error();
    const catalog = await response.json();
    LAKE_CATALOG = Array.isArray(catalog.waterbodies) ? catalog.waterbodies : [];
  } catch(e){ LAKE_CATALOG = []; }
}
async function loadLakeManifest(slug){
  if (LAKE_MANIFESTS.has(slug)) return LAKE_MANIFESTS.get(slug);
  const entry = LAKE_CATALOG.find(item => item && item.slug === slug);
  if (!entry || typeof entry.release !== "string" || !/^[A-Za-z0-9-]+$/.test(entry.release)){
    throw new Error("Lake release is missing");
  }
  const response = await fetch(`lakes/${encodeURIComponent(slug)}/${encodeURIComponent(entry.release)}/lake.json`);
  if (!response.ok) throw new Error(`Lake manifest HTTP ${response.status}`);
  const manifest = await response.json();
  if (!AppCore.validLakeManifest(manifest) || manifest.slug !== slug || manifest.release !== entry.release){
    throw new Error("Invalid lake manifest");
  }
  LAKE_MANIFESTS.set(slug, manifest);
  return manifest;
}
async function load(){
  const raw = await rawGet();
  if (raw) { try { DB = JSON.parse(raw); } catch(e){} }
  normalizeDB();
  if (!raw) seedDemo();
  else if (DB.demoV !== 5 && allPlaces().some(place => place.demo)) seedDemo();
}

/* ---- Демо-места (создаются только при первом открытии) ---- */
function demoPhoto(top, bottom, sun){
  const c = document.createElement("canvas"); c.width = 320; c.height = 240;
  const g = c.getContext("2d");
  const sky = g.createLinearGradient(0,0,0,140);
  sky.addColorStop(0, top); sky.addColorStop(1, bottom);
  g.fillStyle = sky; g.fillRect(0,0,320,140);
  g.fillStyle = sun; g.beginPath(); g.arc(232, 96, 26, 0, 7); g.fill();
  const wat = g.createLinearGradient(0,140,0,240);
  wat.addColorStop(0, bottom); wat.addColorStop(1, "#08202b");
  g.fillStyle = wat; g.fillRect(0,140,320,100);
  g.strokeStyle = "rgba(255,255,255,.16)"; g.lineWidth = 1.5;
  for (let i = 0; i < 9; i++){
    const y = 150 + i*10;
    g.beginPath(); g.moveTo(20 + i*6, y); g.lineTo(300 - i*5, y); g.stroke();
  }
  g.strokeStyle = "#0a2a22"; g.lineWidth = 3;
  for (let i = 0; i < 14; i++){
    const x = 6 + i*8 + (i%3)*4;
    g.beginPath(); g.moveTo(x, 240); g.quadraticCurveTo(x-6, 190, x-11, 148); g.stroke();
  }
  return c.toDataURL("image/jpeg", 0.7);
}

/* ============================================================
   МАТЕМАТИКА КАТУШКИ
   Леска ложится слоями. В слое помещается (ширина шпули / диаметр
   лески) витков, каждый следующий слой шире на два диаметра лески.
   Длина витка = π × текущий диаметр намотки.
   ============================================================ */
const SPOOLS = {
  "1000":[30,13], "1500":[31,13], "2000":[32,14], "2500":[34,14], "3000":[36,15],
  "3500":[37,15], "4000":[38,16], "4500":[40,17], "5000":[41,17], "6000":[44,18],
  "8000":[47,20], "10000":[50,22]
};
function spoolOK(s){ return s.core>0 && s.width>0 && s.lineD>0.01; }
function perLayer(s){ return Math.max(1, Math.floor(s.width / s.lineD)); }

function turnsForLength(L, s){          // сколько витков займёт L метров, считая от пустой шпули
  if (!spoolOK(s) || L <= 0) return 0;
  const N = perLayer(s); let rem = L, turns = 0, k = 0;
  while (rem > 0 && k < 600){
    const D = (s.core + (2*k+1)*s.lineD)/1000;
    const layer = Math.PI * D * N;
    if (rem >= layer){ turns += N; rem -= layer; k++; }
    else { turns += rem / (Math.PI*D); rem = 0; }
  }
  return turns;
}
function lengthForTurns(T, s){          // сколько метров лески в T витках от пустой шпули
  if (!spoolOK(s) || T <= 0) return 0;
  const N = perLayer(s); let rem = T, len = 0, k = 0;
  while (rem > 0 && k < 600){
    const D = (s.core + (2*k+1)*s.lineD)/1000;
    if (rem >= N){ len += Math.PI*D*N; rem -= N; k++; }
    else { len += Math.PI*D*rem; rem = 0; }
  }
  return len;
}
// Обороты РУЧКИ: за один оборот ручки ротор делает «передаточное число» витков
function ratio(s){ return s.ratio > 0 ? s.ratio : 1; }
function metersToTurns(x, s){
  const L = s.lineL; if (x <= 0) return 0; if (x > L) x = L;
  return (turnsForLength(L, s) - turnsForLength(L - x, s)) / ratio(s);
}
function turnsToMeters(t, s){
  const L = s.lineL, Tf = turnsForLength(L, s);
  let rt = t * ratio(s); if (rt <= 0) return 0; if (rt > Tf) rt = Tf;
  return L - lengthForTurns(Tf - rt, s);
}
function handleTurns(s){ return turnsForLength(s.lineL, s) / ratio(s); }
function activeSpool(){
  if (DB.activePreset){ const p = DB.presets.find(p=>p.id===DB.activePreset); if (p) return p.data; }
  return DB.reel;
}
function spoolForLine(l){
  if (l && l.spool && spoolOK(l.spool)) return l.spool;
  const s = activeSpool();
  return spoolOK(s) ? s : null;
}
function lineDistance(turns, l){
  const s = spoolForLine(l);
  return s ? turnsToMeters(turns, s) : 0;
}
function spoolLabel(s){
  if (!s) return "снасть не настроена";
  return s.name || `шпуля ${s.size}, леска ${fmt(s.lineD,2)} мм`;
}
function placeSpools(p){
  const spools = (p.lines||[]).filter(l => (l.measures||[]).length).map(spoolForLine);
  return spools.length && spools.every(Boolean) ? spools : null;
}
function placeSpoolLabel(p){
  const spools = placeSpools(p);
  if (!spools) return null;
  const names = new Set(spools.map(spoolLabel));
  return names.size === 1 ? names.values().next().value : "у каждого луча своя";
}

let route = { view:"waterbodies", id:null, lid:null, wid:null };
let viewCleanup = null;
function go(view, id, lid, wid){
  let placeId = id || null;
  let waterbodyId = wid || null;
  if (view === "waterbody" || view === "watermap"){
    waterbodyId = id || null;
    placeId = null;
  } else if (placeId && !waterbodyId){
    const parent = waterbodyForPlace(placeId);
    waterbodyId = parent ? parent.id : null;
  }
  if (view !== "line" || (lid || null) !== route.lid) openGroups.clear();
  route = { view, id:placeId, lid:lid||null, wid:waterbodyId };
  render(); window.scrollTo(0,0); closeDrawer();
}
function findLine(p, lid){ return (p.lines||[]).find(l => l.id === lid); }

const ICON_MENU = '<path d="M3 6h18M3 12h18M3 18h18"/>';
const ICON_BACK = '<path d="M15 5l-7 7 7 7"/>';

function render(){
  if (viewCleanup){ viewCleanup(); viewCleanup = null; }
  const v = $("#view"), left = $("#leftBtn"), add = $("#addBtn");
  const root = route.view === "waterbodies";
  left.querySelector("svg").innerHTML = root ? ICON_MENU : ICON_BACK;
  left.setAttribute("aria-label", root ? "Меню" : "Назад");
  add.style.visibility = ["waterbodies","waterbody","place","line"].includes(route.view) ? "visible" : "hidden";

  const waterbody = route.wid ? findWaterbody(route.wid) : null;
  const place = route.id ? findPlace(route.id) : null;
  if (["waterbody","watermap"].includes(route.view) && !waterbody) return go("waterbodies");
  if (!["waterbodies","waterbody","watermap","reel"].includes(route.view) && !place) return waterbody ? go("waterbody", waterbody.id) : go("waterbodies");

  if (route.view === "waterbodies"){ $("#barTitle").textContent = "Мои водоёмы"; v.innerHTML = viewWaterbodies(); afterWaterbodies(); }
  else if (route.view === "waterbody"){ $("#barTitle").textContent = waterbody.name; v.innerHTML = viewWaterbody(waterbody); afterWaterbody(waterbody); }
  else if (route.view === "watermap"){ $("#barTitle").textContent = "Карта: " + waterbody.name; v.innerHTML = viewWaterMap(waterbody); afterWaterMap(waterbody); }
  else if (route.view === "place"){ $("#barTitle").textContent = place.name; v.innerHTML = viewPlace(place); afterPlace(place); }
  else if (route.view === "line"){ const line = findLine(place, route.lid); if(!line) return go("place", place.id);
    $("#barTitle").textContent = line.name; v.innerHTML = viewLine(place, line); afterLine(place, line); }
  else if (route.view === "chart"){ const line = findLine(place, route.lid); if(!line) return go("place", place.id);
    $("#barTitle").textContent = "Профиль: " + line.name; v.innerHTML = viewChart(place, line); afterChart(place, line); }
  else if (route.view === "top"){ $("#barTitle").textContent = "Вид сверху"; v.innerHTML = viewTop(place); afterTop(place); }
  else if (route.view === "reel"){ $("#barTitle").textContent = "Калькулятор катушки"; v.innerHTML = viewReel(); afterReel(); }
}
function back(){
  if (route.view === "waterbody" || route.view === "reel") go("waterbodies");
  else if (route.view === "watermap") go("waterbody", route.wid);
  else if (route.view === "place") go("waterbody", route.wid);
  else if (route.view === "line" || route.view === "top") go("place", route.id);
  else if (route.view === "chart") go("line", route.id, route.lid);
  else go("waterbodies");
}

}

const groupKey = (l, group) => l.id + "|" + group.turns;

/* ============================================================
   ЭКРАН: КАРТА ДНА
   ============================================================ */
function viewChart(p, l){
  const s = spoolForLine(l), can = !!s;
  return `
  <div class="chartwrap">
    <canvas id="chart"></canvas>
    <div class="legend" id="legend"></div>
  </div>
  <div class="card" style="margin-top:12px;padding:0">
    <div class="switch">
      <div><div style="font-size:15px">Дальность в метрах</div>
        <div class="tiny muted">${ can ? "по снасти: " + esc(spoolLabel(s)) : "заполните калькулятор катушки" }</div></div>
      <button class="toggle" id="tMeters" aria-pressed="${DB.chartMeters && can}" ${can?"":"disabled"}></button>
    </div>
  </div>
  <button class="btn ghost wide" id="backPlace" style="margin-top:12px">К списку замеров</button>`;
}
function afterChart(p, l){
  const draw = () => drawChart($("#chart"), l);
  draw();
  window.addEventListener("resize", draw);
  viewCleanup = () => window.removeEventListener("resize", draw);
  $("#tMeters").onclick = e => { DB.chartMeters = !DB.chartMeters; save(); render(); };
  $("#backPlace").onclick = () => go("line", p.id, l.id);
}

function chartPoints(l){
  const s = spoolForLine(l), toM = DB.chartMeters && !!s;
  const pts = lineGroups(l).map(group => ({
    x: toM ? turnsToMeters(group.turns, s) : group.turns,
    y: group.count, note: group.note, turns: group.turns, bottom: group.bottom, mark: group.mark, size: group.size
  })).sort((a,b) => a.x - b.x);
  return { pts, unit: toM ? "м" : "об." };
}

function drawChart(cv, l){
  const { pts, unit } = chartPoints(l);
  const w = cv.clientWidth, h = 340, dpr = window.devicePixelRatio || 1;
  cv.width = w*dpr; cv.height = h*dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  const L = 42, R = 14, T = 24, B = 34;
  const iw = w - L - R, ih = h - T - B;

  const maxX = Math.max(...pts.map(q=>q.x), 1);
  const maxY = Math.max(...pts.map(q=>q.y), 1) * 1.15;
  const X = v => L + (v / maxX) * iw;
  const Y = v => T + (v / maxY) * ih;

  // вода
  const wg = g.createLinearGradient(0, T, 0, T+ih);
  wg.addColorStop(0, "#0d3a4b"); wg.addColorStop(1, "#061c26");
  g.fillStyle = wg; g.fillRect(L, T, iw, ih);

  // сетка
  g.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';
  g.textBaseline = "middle";
  const stepY = niceStep(maxY, 5);
  g.setLineDash([2,4]);
  for (let v = 0; v <= maxY; v += stepY){
    const y = Y(v);
    g.strokeStyle = "rgba(143,176,182,.20)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(L, y+.5); g.lineTo(L+iw, y+.5); g.stroke();
    g.fillStyle = "#8FB0B6"; g.textAlign = "right";
    g.fillText(String(Math.round(v*10)/10), L-8, y);
  }
  const stepX = niceStep(maxX, 4);
  g.textAlign = "center";
  for (let v = 0; v <= maxX + .001; v += stepX){
    const x = X(v);
    g.strokeStyle = "rgba(143,176,182,.13)";
    g.beginPath(); g.moveTo(x+.5, T); g.lineTo(x+.5, T+ih); g.stroke();
    g.fillStyle = "#8FB0B6"; g.fillText(String(Math.round(v*10)/10), x, T+ih+14);
  }
  g.setLineDash([]);

  // профиль дна: каждый участок красится в цвет своего грунта
  const P = pts.map(q => ({ x: X(q.x), y: Y(q.y) }));
  const seg = [];
  for (let i = 0; i < P.length-1; i++){
    const p0 = P[i-1]||P[i], p1 = P[i], p2 = P[i+1], p3 = P[i+2]||P[i+1];
    seg.push({
      p1, p2,
      c1: { x: p1.x + (p2.x-p0.x)/6, y: p1.y + (p2.y-p0.y)/6 },
      c2: { x: p2.x - (p3.x-p1.x)/6, y: p2.y - (p3.y-p1.y)/6 },
      col: (BOT(pts[i+1].bottom) || BOT(pts[i].bottom) || { c: DEFCOL }).c
    });
  }
  const base = T + ih;
  seg.forEach(s2 => {
    const f = new Path2D();
    f.moveTo(s2.p1.x, s2.p1.y);
    f.bezierCurveTo(s2.c1.x, s2.c1.y, s2.c2.x, s2.c2.y, s2.p2.x, s2.p2.y);
    f.lineTo(s2.p2.x, base); f.lineTo(s2.p1.x, base); f.closePath();
    g.save(); g.globalAlpha = .28; g.fillStyle = s2.col; g.fill(f); g.restore();
  });
  g.lineJoin = "round"; g.lineCap = "round"; g.lineWidth = 3;
  seg.forEach(s2 => {
    g.strokeStyle = s2.col;
    g.beginPath(); g.moveTo(s2.p1.x, s2.p1.y);
    g.bezierCurveTo(s2.c1.x, s2.c1.y, s2.c2.x, s2.c2.y, s2.p2.x, s2.p2.y);
    g.stroke();
  });

  // бровка: два самых крутых участка
  const steps = pts.slice(1).map((q,i) => ({ i: i+1, d: q.y - pts[i].y }));
  const lim = Math.max(3, maxY*0.14);
  steps.filter(s3 => Math.abs(s3.d) >= lim).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,2).forEach(s3 => {
    const mx = (X(pts[s3.i-1].x)+X(pts[s3.i].x))/2, my = (Y(pts[s3.i-1].y)+Y(pts[s3.i].y))/2;
    g.fillStyle = "rgba(234,244,243,.85)"; g.textAlign = "center";
    g.font = '9px ui-monospace, SFMono-Regular, Menlo, monospace';
    g.fillText(s3.d > 0 ? "БРОВКА ↓" : "ПОДЪЁМ ↑", mx, my + 16);
  });

  // точки и метки
  pts.forEach(q => {
    const x = X(q.x), y = Y(q.y);
    g.beginPath(); g.arc(x, y, 4.5, 0, 7); g.fillStyle = "#07171E"; g.fill();
    g.lineWidth = 2; g.strokeStyle = "#4FD1C5"; g.stroke();
    g.fillStyle = "#EAF4F3"; g.textAlign = "center";
    g.font = '11px ui-monospace, SFMono-Regular, Menlo, monospace';
    g.fillText(String(Math.round(q.y*10)/10), x, y - 13);
    const mk = MRK(q.mark);
    if (mk){
      g.beginPath(); g.arc(x, y - 30, 9, 0, 7);
      g.fillStyle = "#11303C"; g.fill(); g.strokeStyle = "#4FD1C5"; g.lineWidth = 1.4; g.stroke();
      g.fillStyle = "#EAF4F3"; g.font = '11px system-ui, sans-serif';
      g.fillText(mk.i, x, y - 26);
    }
  });

  // подписи осей
  g.fillStyle = "#8FB0B6"; g.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';
  g.textAlign = "left"; g.fillText("СЧЁТ", 4, T-12);
  g.textAlign = "right"; g.fillText("ДАЛЬНОСТЬ, " + unit.toUpperCase(), w-R, T-12);

  // легенда
  const ys = pts.map(q=>q.y);
  const deepest = pts[ys.indexOf(Math.max(...ys))], shallow = pts[ys.indexOf(Math.min(...ys))];
  const used = BOTTOM.filter(b => pts.some(q => q.bottom === b.k));
  $("#legend").innerHTML =
    `<span>Глубже всего <b class="num">${fmt(deepest.y)}</b> на <b class="num">${fmt(deepest.x)} ${unit}</b></span>` +
    `<span>Мельче всего <b class="num">${fmt(shallow.y)}</b> на <b class="num">${fmt(shallow.x)} ${unit}</b></span>` +
    (used.length ? `<span style="flex-basis:100%;display:flex;gap:12px;flex-wrap:wrap;padding-top:2px">` +
      used.map(b=>`<span style="display:flex;align-items:center;gap:6px"><i class="sw" style="background:${b.c}"></i>${b.n}</span>`).join("") + `</span>` : "");
}
function niceStep(max, want){
  const raw = max / want, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}
function drawSpark(cv, l){
  if (!l) return;
  const pts = lineGroups(l).sort((a,b)=>a.turns-b.turns);
  if (pts.length < 2) return;
  const w = cv.clientWidth || 240, h = 34, dpr = window.devicePixelRatio||1;
  cv.width = w*dpr; cv.height = h*dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  const maxX = Math.max(...pts.map(q=>q.turns),1), maxY = Math.max(...pts.map(q=>q.count),1)*1.2;
  g.fillStyle = "rgba(13,58,75,.55)"; g.fillRect(0,0,w,h);
  g.beginPath();
  pts.forEach((q,i) => { const x = (q.turns/maxX)*w, y = (q.count/maxY)*h; i?g.lineTo(x,y):g.moveTo(x,y); });
  g.strokeStyle = "rgba(240,180,41,.85)"; g.lineWidth = 1.6; g.stroke();
  g.lineTo(w,h); g.lineTo(0,h); g.closePath();
  g.fillStyle = "rgba(240,180,41,.14)"; g.fill();
}

let topFull = false, topHit = [], topZoom = 1, topPanX = 0, topPanY = 0;
function viewTop(p){
  const label = placeSpoolLabel(p), can = !!label;
  return `
  <div class="chartwrap ${topFull?"full":""}" id="topwrap">
    <canvas id="topmap"></canvas>
    <button class="fsbtn" id="tFull" aria-label="Во весь экран">${topFull?"✕":"⤢"}</button>
    <div class="zoombar">

    </div>
    <div class="tinfo" id="tinfo">Нажмите на точку, чтобы посмотреть замер. Щипок — зум, палец — сдвиг.</div>

      <button class="toggle" id="tMeters" aria-pressed="${DB.chartMeters && can}" ${can?"":"disabled"}></button>
    </div>
  </div>
  <button class="btn ghost wide" id="backPlace" style="margin-top:12px">К лучам</button>`;
}
function afterTop(p){
  const cv = $("#topmap");
  let raf = 0;
  const draw = () => drawTop(cv, p);
  const redraw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };
  draw();
  window.addEventListener("resize", draw);
  viewCleanup = () => window.removeEventListener("resize", draw);

  const hit = (mx, my) => {
    let best = null, bd = 28;
    topHit.forEach(h => { const dd = Math.hypot(h.sx-mx, h.sy-my); if (dd < bd){ bd = dd; best = h; } });
    $("#tinfo").innerHTML = best
      ? `<b>${esc(best.line)}</b> · ${fmt(best.d)} ${best.unit} · счёт <b>${fmt(best.y)}</b>${best.size>1?" (среднее ×"+best.size+")":""}${best.bottom?" · "+BOT(best.bottom).n:""}`
      : "Нажмите на точку, чтобы посмотреть замер. Щипок — зум, палец — сдвиг.";
  };
  cv.onclick = e => { const r = cv.getBoundingClientRect(); hit(e.clientX-r.left, e.clientY-r.top); };

  const dist = t => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const mid  = t => ({ x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2 });
  let mode = null, sD = 0, sZ = 1, sX = 0, sY = 0, pX = 0, pY = 0, moved = 0, t0 = 0;
  cv.addEventListener("touchstart", e => {
    if (e.touches.length === 2){
      mode = "zoom"; sD = dist(e.touches); sZ = topZoom;
      const m = mid(e.touches); sX = m.x; sY = m.y; pX = topPanX; pY = topPanY;
    } else if (e.touches.length === 1){
      mode = "pan"; sX = e.touches[0].clientX; sY = e.touches[0].clientY;
      pX = topPanX; pY = topPanY; moved = 0; t0 = Date.now();
    }
  }, { passive:true });
  cv.addEventListener("touchmove", e => {
    if (mode === "zoom" && e.touches.length === 2){
      const d = dist(e.touches); topZoom = clamp(sZ * d / (sD||1), 1, 8);
      const m = mid(e.touches); topPanX = pX + (m.x - sX); topPanY = pY + (m.y - sY);
      e.preventDefault(); redraw();
    } else if (mode === "pan" && e.touches.length === 1){
      const dx = e.touches[0].clientX - sX, dy = e.touches[0].clientY - sY;
      moved = Math.max(moved, Math.hypot(dx, dy));
      if (moved > 8){ topPanX = pX + dx; topPanY = pY + dy; e.preventDefault(); redraw(); }
    }
  }, { passive:false });
  cv.addEventListener("touchend", e => {
    if (mode === "pan" && moved < 8 && Date.now() - t0 < 400){
      const r = cv.getBoundingClientRect(), t = e.changedTouches[0];
      hit(t.clientX - r.left, t.clientY - r.top);
    }
    mode = null;
  });

  $("#zIn").onclick  = () => { topZoom = clamp(topZoom*1.4, 1, 8); redraw(); };
  $("#zOut").onclick = () => { topZoom = clamp(topZoom/1.4, 1, 8); if (topZoom === 1){ topPanX = topPanY = 0; } redraw(); };
  $("#zRst").onclick = () => { topZoom = 1; topPanX = topPanY = 0; redraw(); };
  $("#tFull").onclick = () => {
    topFull = !topFull;
    $("#topwrap").classList.toggle("full", topFull);
    $("#tFull").textContent = topFull ? "✕" : "⤢";
    document.body.style.overflow = topFull ? "hidden" : "";
    setTimeout(draw, 40);
  };
  $("#tMeters").onclick = () => { DB.chartMeters = !DB.chartMeters; save(); render(); };
  $("#backPlace").onclick = () => { document.body.style.overflow = ""; topFull = false; go("place", p.id); };
}
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function meanAngle(arr){
  const x = arr.reduce((s,a)=>s+Math.cos(a*Math.PI/180),0), y = arr.reduce((s,a)=>s+Math.sin(a*Math.PI/180),0);
  return (Math.atan2(y,x)*180/Math.PI + 360) % 360;
}
function angDiff(a,b){ return ((a-b+540)%360)-180; }

/* цветовая шкала глубины: мель → яма */
const RAMP = [[0,251,239,176],[.35,111,209,168],[.65,46,159,196],[1,31,63,143]];
function rampRGB(t){
  t = clamp(t,0,1);
  for (let i = 0; i < RAMP.length-1; i++){
    const a = RAMP[i], b = RAMP[i+1];
    if (t <= b[0]){
      const k = (t-a[0])/(b[0]-a[0]||1);
      return [a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k, a[3]+(b[3]-a[3])*k].map(Math.round);
    }
  }
  return [31,63,143];
}
const rampCSS = t => { const c = rampRGB(t); return `rgb(${c[0]},${c[1]},${c[2]})`; };
const EDGE = 9;   // на сколько градусов заливка выходит за крайние лучи

function drawTop(cv, p){
  const toM = DB.chartMeters && !!placeSpools(p);
  const lines = (p.lines||[]).filter(l => (l.measures||[]).length);
  const w = cv.clientWidth || 320;
  const dpr = window.devicePixelRatio || 1;
  const g0 = cv.getContext("2d");
  topHit = [];
  if (!lines.length){
    cv.style.height = "200px"; cv.width = w*dpr; cv.height = 200*dpr;
    g0.setTransform(dpr,0,0,dpr,0,0); g0.fillStyle = "#061219"; g0.fillRect(0,0,w,200);
    $("#tlegend").innerHTML = "<span>Нет замеров</span>"; return;
  }

  const known = lines.filter(l => l.az != null).map(l => l.az);
  const mean = known.length ? meanAngle(known) : null;
  const rays = lines.map((l,i) => ({
    name: l.name, az: l.az,
    rel: (l.az != null && mean != null) ? clamp(angDiff(l.az, mean), -85, 85) : (i - (lines.length-1)/2) * 18,
    pts: lineGroups(l).map(group => ({
      d: toM ? lineDistance(group.turns, l) : group.turns,
      y: group.count, bottom: group.bottom, mark: group.mark, size: group.size
    })).sort((a,b) => a.d - b.d)
  })).sort((a,b) => a.rel - b.rel);

  const flat = rays.flatMap(r => r.pts);
  const maxD = Math.max(1, ...flat.map(q => q.d));
  const ys = flat.map(q => q.y), minY = Math.min(...ys), maxY = Math.max(...ys);
  const unit = toM ? "м" : "об.";

  // --- геометрия: веер растягивается на всю ширину, высота подгоняется под него ---
  const rad = a => a*Math.PI/180;
  const lo = rays[0].rel - EDGE, hi = rays[rays.length-1].rel + EDGE;
  let minS = 1, maxS = -1, maxC = 0;
  for (let a = lo; a <= hi + .001; a += 1){
    minS = Math.min(minS, Math.sin(rad(a))); maxS = Math.max(maxS, Math.sin(rad(a)));
    maxC = Math.max(maxC, Math.cos(rad(a)));
  }
  const padX = 30, padTop = 30, padBot = 40;
  const Rw = (w - 2*padX) / Math.max(.25, maxS - minS);
  const fit = Math.round(padTop + Rw*Math.max(.35, maxC) + padBot);
  const h = clamp(fit, 300, topFull ? Math.max(360, window.innerHeight - 120) : 460);
  const R0 = Math.min(Rw, (h - padTop - padBot) / Math.max(.35, maxC));
  const R = R0 * topZoom;

  cv.style.height = h + "px"; cv.width = w*dpr; cv.height = h*dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle = "#061219"; g.fillRect(0,0,w,h);

  const cx = (w - R*(maxS + minS))/2 + topPanX;
  const cy = h - padBot + topPanY;
  const mono = '10px ui-monospace, SFMono-Regular, Menlo, monospace';

  const sampleRay = (r, d) => {
    const q = r.pts; if (!q.length) return null;
    if (d <= q[0].d) return q[0].y;
    if (d > q[q.length-1].d) return null;
    for (let i = 0; i < q.length-1; i++)
      if (d <= q[i+1].d){
        const k = (d - q[i].d) / ((q[i+1].d - q[i].d) || 1);
        return q[i].y + (q[i+1].y - q[i].y)*k;
      }
    return null;
  };
  const depthAt = (ang, d) => {
    if (ang < lo || ang > hi) return null;
    if (ang <= rays[0].rel) return sampleRay(rays[0], d);
    if (ang >= rays[rays.length-1].rel) return sampleRay(rays[rays.length-1], d);
    for (let i = 0; i < rays.length-1; i++){
      if (ang <= rays[i+1].rel){
        const v1 = sampleRay(rays[i], d), v2 = sampleRay(rays[i+1], d);
        if (v1 == null && v2 == null) return null;
        if (v1 == null) return v2;
        if (v2 == null) return v1;
        const k = (ang - rays[i].rel) / ((rays[i+1].rel - rays[i].rel) || 1);
        return v1 + (v2 - v1)*k;
      }
    }
    return null;
  };

  // --- поле глубины ---
  const CELL = 3, SW = Math.ceil(w/CELL), SH = Math.ceil(h/CELL);
  const grid = new Float64Array(SW*SH).fill(NaN);
  const off = document.createElement("canvas"); off.width = SW; off.height = SH;
  const og = off.getContext("2d"), img = og.createImageData(SW, SH);
  for (let yy = 0; yy < SH; yy++){
    for (let xx = 0; xx < SW; xx++){
      const px = xx*CELL + CELL/2, py = yy*CELL + CELL/2;
      const dx = px - cx, dy = cy - py;
      const r = Math.hypot(dx, dy);
      if (r > R || dy < -2) continue;
      const v = depthAt(Math.atan2(dx, dy)*180/Math.PI, r/R*maxD);
      if (v == null) continue;
      grid[yy*SW+xx] = v;
      const c = rampRGB((v - minY) / ((maxY - minY) || 1));
      const o = (yy*SW+xx)*4;
      img.data[o] = c[0]; img.data[o+1] = c[1]; img.data[o+2] = c[2]; img.data[o+3] = 235;
    }
  }
  og.putImageData(img, 0, 0);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  g.drawImage(off, 0, 0, w, h);

  // --- изолинии ---
  const gx = i => i*CELL + CELL/2, gy = j => j*CELL + CELL/2;
  const step = niceStep(Math.max(1, maxY-minY), 5);
  g.lineWidth = 1.1; g.font = mono;
  for (let lv = Math.ceil(minY/step)*step; lv < maxY; lv += step){
    g.strokeStyle = "rgba(255,255,255,.36)";
    g.beginPath();
    let label = null;
    for (let j = 0; j < SH-1; j++){
      for (let i = 0; i < SW-1; i++){
        const a = grid[j*SW+i], b = grid[j*SW+i+1], c = grid[(j+1)*SW+i+1], d = grid[(j+1)*SW+i];
        if (isNaN(a)||isNaN(b)||isNaN(c)||isNaN(d)) continue;
        const t = (v1,v2) => (lv - v1)/((v2 - v1) || 1);
        const pp = [];
        if ((a<lv) !== (b<lv)) pp.push({ x: gx(i) + CELL*t(a,b), y: gy(j) });
        if ((b<lv) !== (c<lv)) pp.push({ x: gx(i+1), y: gy(j) + CELL*t(b,c) });
        if ((d<lv) !== (c<lv)) pp.push({ x: gx(i) + CELL*t(d,c), y: gy(j+1) });
        if ((a<lv) !== (d<lv)) pp.push({ x: gx(i), y: gy(j) + CELL*t(a,d) });
        if (pp.length >= 2){
          g.moveTo(pp[0].x, pp[0].y); g.lineTo(pp[1].x, pp[1].y);
          if (!label || pp[0].x < label.x) label = pp[0];
        }
      }
    }
    g.stroke();
    if (label){
      const txt = String(Math.round(lv*10)/10);
      g.textAlign = "center"; g.lineWidth = 3; g.strokeStyle = "rgba(6,18,25,.9)";
      g.strokeText(txt, label.x, label.y - 3);
      g.fillStyle = "#EAF4F3"; g.fillText(txt, label.x, label.y - 3);
      g.lineWidth = 1.1;
    }
  }

  // --- лучи, точки, метки ---
  const labels = [];
  rays.forEach(r => {
    const a = rad(r.rel);
    const px = d => cx + R*(d/maxD)*Math.sin(a), py = d => cy - R*(d/maxD)*Math.cos(a);
    const far = r.pts[r.pts.length-1].d;
    g.setLineDash([3,4]); g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(px(far), py(far)); g.stroke();
    g.setLineDash([]);
    r.pts.forEach(q => {
      const x = px(q.d), y = py(q.d);
      if (x < -20 || x > w+20 || y < -20 || y > h+20) return;
      g.beginPath(); g.arc(x, y, 4, 0, 7);
      g.fillStyle = (BOT(q.bottom) || { c:"#EAF4F3" }).c; g.fill();
      g.strokeStyle = "rgba(6,18,25,.8)"; g.lineWidth = 1.3; g.stroke();
      topHit.push({ sx: x, sy: y, d: q.d, y: q.y, bottom: q.bottom, size: q.size, line: r.name, unit });
      const mk = MRK(q.mark);
      if (mk){
        g.beginPath(); g.arc(x + 9, y - 9, 6.5, 0, 7);
        g.fillStyle = "rgba(7,23,30,.9)"; g.fill();
        g.strokeStyle = "rgba(234,244,243,.7)"; g.lineWidth = 1; g.stroke();
        g.fillStyle = "#EAF4F3"; g.font = '9px system-ui, sans-serif'; g.textAlign = "center";
        g.fillText(mk.i, x + 9, y - 5.8);
        g.font = mono;
      }
    });
    const ex = px(far), ey = py(far);
    labels.push({
      x: clamp(ex, 46, w-46), y: clamp(ey - 12, 14, h-14),
      align: r.rel < -25 ? "left" : r.rel > 25 ? "right" : "center",
      text: (r.name.length > 13 ? r.name.slice(0,12)+"…" : r.name) + (r.az != null ? " " + r.az + "°" : "")
    });
  });

  // подписи лучей: разводим, чтобы не наезжали друг на друга
  g.font = mono;
  const placed = [];
  labels.sort((a,b) => a.y - b.y).forEach(L => {
    const wd = g.measureText(L.text).width;
    L.x0 = L.align === "left" ? L.x : L.align === "right" ? L.x - wd : L.x - wd/2;
    L.x1 = L.x0 + wd;
    let guard = 0;
    while (placed.some(q => Math.abs(q.y - L.y) < 14 && L.x0 < q.x1 + 8 && q.x0 < L.x1 + 8) && guard++ < 10) L.y += 15;
    placed.push(L);
    g.textAlign = L.align;
    g.lineWidth = 3.5; g.strokeStyle = "rgba(6,18,25,.9)"; g.strokeText(L.text, L.x, L.y);
    g.fillStyle = "#EAF4F3"; g.fillText(L.text, L.x, L.y);
  });

  // --- рыбак ---
  if (cy < h + 30){
    g.beginPath(); g.moveTo(cx, cy-9); g.lineTo(cx-7, cy+5); g.lineTo(cx+7, cy+5); g.closePath();
    g.fillStyle = "#F0B429"; g.fill();
    g.fillStyle = "#8FB0B6"; g.textAlign = "center"; g.font = mono;
    g.fillText("ВЫ", cx, cy + 19);
  }
  g.fillStyle = "#8FB0B6"; g.font = mono; g.textAlign = "right";
  if (mean != null) g.fillText("центр " + Math.round(mean) + "°", w - 8, h - 8);
  if (topZoom > 1.02){ g.textAlign = "left"; g.fillText("×" + fmt(topZoom,1), 8, h - 8); }

  const usedB = BOTTOM.filter(b => flat.some(q => q.bottom === b.k));
  $("#tlegend").innerHTML =
    `<span style="display:flex;align-items:center;gap:7px">Счёт ${fmt(minY)}
      <i style="width:66px;height:9px;border-radius:5px;display:inline-block;background:linear-gradient(90deg,${rampCSS(0)},${rampCSS(.35)},${rampCSS(.65)},${rampCSS(1)})"></i> ${fmt(maxY)}</span>` +
    `<span>Изолинии через <b>${fmt(step)}</b></span>` +
    `<span>Дальность в ${unit}</span>` +
    (usedB.length ? `<span style="flex-basis:100%;display:flex;gap:12px;flex-wrap:wrap;padding-top:2px">` +
      usedB.map(b=>`<span style="display:flex;align-items:center;gap:6px"><i class="sw" style="background:${b.c}"></i>${b.n}</span>`).join("") + `</span>` : "");
}

   ГЕОРЕФЕРЕНСНАЯ КАРТА ВОДОЁМА

function viewWaterMap(waterbody){
  return `
  <div class="chartwrap"><div id="watermap" aria-label="Карта водоёма"></div></div>
  <div class="map-status" id="mapStatus">Загружаю локальный пакет водоёма...</div>`;
}
async function afterWaterMap(waterbody){
  const status = $("#mapStatus");
  try {
    if (!window.L) throw new Error("Leaflet не загружен");
    const manifest = await loadLakeManifest(waterbody.packageSlug);
    if (route.view !== "watermap" || route.wid !== waterbody.id || !$("#watermap")) return;
    const [minLon, minLat, maxLon, maxLat] = manifest.bbox;
    const bounds = L.latLngBounds([minLat,minLon], [maxLat,maxLon]);
    const nativeMin = manifest.minZoom;
    const nativeZoom = manifest.maxZoom;
    const map = L.map("watermap", {
      minZoom:Math.max(0, nativeMin - 4),
      maxZoom:nativeZoom + 3,
      maxBounds:bounds.pad(0.75),
      maxBoundsViscosity:0.7
    });
    viewCleanup = () => map.remove();
    L.tileLayer(`lakes/${encodeURIComponent(manifest.slug)}/${encodeURIComponent(manifest.release)}/tiles/{z}/{x}/{y}.png`, {
      minNativeZoom:nativeMin,
      maxNativeZoom:nativeZoom,
      minZoom:nativeMin,
      maxZoom:nativeZoom + 3,
      tileSize:manifest.tileSize,
      bounds,
      noWrap:true,
      keepBuffer:2,
      attribution:manifest.attribution || ""
    }).addTo(map);
    const boundaryLayer = L.geoJSON({ type:"Feature", properties:{}, geometry:manifest.boundary }, {
      style:{ color:"#4FD1C5", weight:2, opacity:0.9, fill:false }
    }).addTo(map);
    map.fitBounds(boundaryLayer.getBounds(), { padding:[12,12] });

    const projected = [];
    let missingCoords = 0;
    let missingAzimuth = 0;
    let missingSpool = 0;
    (waterbody.places||[]).forEach(place => {
      const origin = AppCore.parseCoords(place.coords);
      if (!origin){ missingCoords++; return; }
      L.circleMarker([origin.lat,origin.lon], {
        radius:7, color:"#07171E", weight:2, fillColor:"#F0B429", fillOpacity:1
      }).bindTooltip(`<b>${esc(place.name)}</b><br>место ловли`).addTo(map);
      missingAzimuth += (place.lines||[]).filter(line => (line.measures||[]).length && line.az == null).length;
      missingSpool += (place.lines||[]).filter(line => (line.measures||[]).length && !spoolForLine(line)).length;
      AppCore.projectSoundings(place, lineDistance).forEach(line => {
        const source = (place.lines||[]).find(item => item.id === line.lineId);
        projected.push({
          place,
          line,
          spool:spoolForLine(source),
          points:line.points.slice().sort((left,right) => left.distanceMeters - right.distanceMeters)
        });
      });
    });
    const counts = projected.flatMap(item => item.points.map(point => point.count));
    const minCount = counts.length ? Math.min(...counts) : 0;
    const maxCount = counts.length ? Math.max(...counts) : 1;
    projected.forEach(item => {
      const latLngs = [[item.line.origin.lat,item.line.origin.lon], ...item.points.map(point => [point.lat,point.lon])];
      L.polyline(latLngs, { color:"#EAF4F3", weight:1.5, opacity:0.8, dashArray:"4 5" })
        .bindTooltip(esc(item.line.name || "Луч"))
        .addTo(map);
      item.points.forEach(point => {
        const color = rampCSS((point.count - minCount) / ((maxCount - minCount) || 1));
        L.circleMarker([point.lat,point.lon], {
          radius:6, color:"#07171E", weight:1.5, fillColor:color, fillOpacity:0.96
        }).bindTooltip(
          `<b>${esc(item.place.name)}</b><br>${esc(item.line.name || "Луч")}<br>` +
          `счёт ${fmt(point.count)}${ point.size > 1 ? " (среднее ×" + point.size + ")" : "" }, ${fmt(point.distanceMeters)} м<br>` +
          `<span style="opacity:.75">${esc(spoolLabel(item.spool))}</span>`
        ).addTo(map);
      });
    });
    const notes = [`Показано мест: ${(waterbody.places||[]).length - missingCoords}`, `точек: ${counts.length}`];
    if (missingSpool) notes.push(`лучей без снасти: ${missingSpool}`);
    if (missingCoords) notes.push(`без координат: ${missingCoords}`);
    if (missingAzimuth) notes.push(`лучей без азимута: ${missingAzimuth}`);
    const paintStatus = () => {
      const hidden = map.getZoom() < nativeMin;
      status.textContent = notes.concat(hidden ? ["батиметрия появится при увеличении"] : []).join(" · ");
    };
    map.on("zoomend", paintStatus);
    paintStatus();
    setTimeout(() => map.invalidateSize(), 0);
  } catch(error){
    status.textContent = "Не удалось открыть локальный пакет: " + error.message;
  }
}

let compassStop = null;
function readCompass(cb){
  if (compassStop) compassStop();
  const attach = () => {
    let got = false, timer = null;
    const h = e => {
      let deg = null;
      if (typeof e.webkitCompassHeading === "number") deg = e.webkitCompassHeading;
      else if (typeof e.alpha === "number") deg = (360 - e.alpha) % 360;
      if (deg == null || isNaN(deg)) return;
      got = true; cb(Math.round(deg));
    };
    window.addEventListener("deviceorientationabsolute", h, true);
    window.addEventListener("deviceorientation", h, true);
    compassStop = () => {
      window.removeEventListener("deviceorientationabsolute", h, true);
      window.removeEventListener("deviceorientation", h, true);
      clearTimeout(timer);
      compassStop = null;
    };
    toast("Наведите телефон вдоль удилища");
    timer = setTimeout(() => { if (compassStop) compassStop(); if (!got) toast("Компас недоступен — впишите вручную"); }, 8000);
  };
  try {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
      DeviceOrientationEvent.requestPermission().then(r => r === "granted" ? attach() : toast("Компас не разрешён"));
      return;
    }
  } catch(e){}
  attach();
}

function readReel(){
  return {
    size: $("#rSize").value, core: num($("#rCore").value), width: num($("#rWidth").value),

function afterReel(){
  const recalc = (detachPreset = false) => {
    if (detachPreset) DB.activePreset = null;
    DB.reel = readReel(); save();
    if (detachPreset) paint();
    const s = DB.reel, out = $("#rOut");
    if (!spoolOK(s) || s.lineL <= 0){ out.innerHTML = `<div class="span2"><div class="k">Нет данных</div><div class="v">— · —</div></div>`; return; }
    const H = handleTurns(s);
    const first = turnsToMeters(1, s);                 // метры за первый оборот ручки (шпуля полная)
    const last  = s.lineL - turnsToMeters(H-1, s);     // метры за последний оборот (шпуля почти пустая)
    const layers = Math.ceil(turnsForLength(s.lineL, s) / perLayer(s));
    out.innerHTML =
      `<div class="span2"><div class="k">Оборотов ручки на ${fmt(s.lineL)} м</div><div class="v big">${fmt(H,0)}</div></div>
       <div><div class="k">За оборот, полная</div><div class="v">${fmt(first,2)} м</div></div>
       <div><div class="k">За оборот, пустая</div><div class="v">${fmt(last,2)} м</div></div>
       <div><div class="k">Слоёв намотки</div><div class="v">${layers}</div></div>
       <div><div class="k">Витков в слое</div><div class="v">${perLayer(s)}</div></div>`;
  };
  $("#rSize").onchange = e => {
    const v = e.target.value;
    if (SPOOLS[v]){ $("#rCore").value = SPOOLS[v][0]; $("#rWidth").value = SPOOLS[v][1]; }
    recalc(true);
  };
  ["#rCore","#rWidth","#rRatio","#rLineD","#rLineL"].forEach(id => $(id).oninput = () => recalc(true));

  const cM = $("#cM"), cT = $("#cT");
  cM.oninput = () => { const s = readReel(); cT.value = cM.value === "" ? "" : inputFmt(metersToTurns(num(cM.value), s), 1); };
  cT.oninput = () => { const s = readReel(); cM.value = cT.value === "" ? "" : inputFmt(turnsToMeters(num(cT.value), s), 1); };

  const paint = () => {
    $("#presetList").innerHTML = DB.presets.map(p =>
      `<span class="chip ${DB.activePreset===p.id?"on":""}"><button data-load="${esc(p.id)}" style="color:inherit">${esc(p.name)}</button><button class="x" data-pdel="${esc(p.id)}" aria-label="Удалить">×</button></span>`
    ).join("");
    document.querySelectorAll("[data-load]").forEach(b => b.onclick = () => {
      const p = DB.presets.find(x => x.id === b.dataset.load); if (!p) return;
      DB.reel = { ...p.data }; DB.activePreset = p.id; save(); render(); toast("Пресет «" + p.name + "» загружен");
    });
    document.querySelectorAll("[data-pdel]").forEach(b => b.onclick = () => {
      DB.presets = DB.presets.filter(x => x.id !== b.dataset.pdel);
      if (DB.activePreset === b.dataset.pdel) DB.activePreset = null;
      save(); paint();
    });
  };
  $("#pSave").onclick = () => {
    const name = $("#pName").value.trim();
    if (!name) return toast("Введите название пресета");
    const p = { id: uid(), name, data: readReel() };
    DB.presets.push(p); DB.activePreset = p.id; DB.reel = p.data;
    $("#pName").value = ""; save(); paint(); toast("Пресет сохранён");
  };
  recalc(); paint();
}

function shrink(file, cb){
  const img = new Image(), fr = new FileReader();
  fr.onload = () => { img.onload = () => {
    const max = 1000, k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL("image/jpeg", 0.72));
  }; img.src = fr.result; };
  fr.readAsDataURL(file);
}

  modal.innerHTML = `<div class="sheet">
    <div class="grab"></div>
    <h2>Установить на телефон</h2>
    <ol style="margin:0 0 12px;padding-left:20px;font-size:14px;line-height:1.6">${steps.map(step => `<li>${step}</li>`).join("")}</ol>
    <div class="tiny muted" style="margin-bottom:12px">После установки приложение открывается с домашнего экрана и работает без интернета.</div>
    <div class="row"><button class="btn primary" id="installOk">Понятно</button></div>
  </div>`;
  modal.classList.add("on");
  modal.onclick = event => { if (event.target === modal) closeModal(); };
  $("#installOk").onclick = closeModal;
}
window.addEventListener("beforeinstallprompt", event => { event.preventDefault(); installEvent = event; syncInstall(); });
window.addEventListener("appinstalled", () => { installEvent = null; $("#installBtn").hidden = true; toast("Приложение добавлено на экран"); });
$("#installBtn").onclick = async () => {
  closeDrawer();
  if (!installEvent) return installSheet();
  const event = installEvent;
  installEvent = null;
  event.prompt();
  const choice = await event.userChoice;
  if (choice.outcome !== "accepted") toast("Установка отменена");
};
syncInstall();
window.addEventListener("keydown", event => { if (event.key === "Escape"){ closeModal(); closeDrawer(); } });
let swReloading = false;
function offerUpdate(worker){
  if (!worker || !navigator.serviceWorker.controller) return;
  const button = $("#updateBtn");
  button.hidden = false;
  button.onclick = () => {
    button.disabled = true;
    button.textContent = "Обновляю…";
    worker.postMessage({ type:"skip-waiting" });
  };
}
function watchServiceWorker(registration){
  offerUpdate(registration.waiting);
  registration.addEventListener("updatefound", () => {
    const worker = registration.installing;
    if (!worker) return;
    worker.addEventListener("statechange", () => { if (worker.state === "installed") offerUpdate(worker); });
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") registration.update().catch(() => {});
  });
}
Promise.all([load(), loadLakeCatalog()]).then(() => {
  render();
  if ("serviceWorker" in navigator){
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (swReloading) return;
      swReloading = true;
      location.reload();
    });
    navigator.serviceWorker.register("sw.js").then(watchServiceWorker).catch(() => {});
  }
});
</script>
